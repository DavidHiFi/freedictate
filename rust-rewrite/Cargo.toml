[package]
name = "freedictate-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1.0.150"
serde = { version = "1", features = ["derive"] }
cpal = "0.18"
rubato = "5"
whisper-rs = "0.16"
ureq = "3"
# CPU rendering (tiny-skia): a dictation utility has no shader needs, and a
# wedged GPU driver must never block the window from opening.
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "svg", "crisp", "web-colors", "thread-pool", "image"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_System_Registry",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
] }
fancy-regex = "0.20.0"
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.11"

[dev-dependencies]
hound = "3.5"

[build-dependencies]
# Embeds assets/freedictate.ico as the exe/taskbar icon, like the Python
# app's write_ico output in the installer.
winresource = "0.1"
